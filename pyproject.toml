[build-system]
requires = ["cython<4", "numpy<3", "setuptools", "setuptools_scm", "wheel"]

[project]
name = "smrf"
description = "Forcing input framework for iSnobal"
dynamic = ["version"]
requires-python = ">=3.14"
readme = "README.md"
keywords = ['iSnobal', 'Snow', 'Modeling']
classifiers = [
    "Intended Audience :: Science/Research",
    "Natural Language :: English",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "coloredlogs",
    "cfgrib",
    "m3w-inicheck",
    "netCDF4",
    "numpy<3",
    "pandas<4",
    "pykrige",
    "pytz",
    "scipy<2",
    "topocalc @ git+https://github.com/iSnobal/topocalc.git@20260526",
    "utm",
    "xarray<2027",
]

[project.scripts]
run_smrf = 'smrf.cli.run_smrf:run'

[project.optional-dependencies]
dev = ["mock"]
docs = [
    'Sphinx>=3.0,<=4.0',
    'pydata-sphinx-theme',
    'sphinxcontrib-bibtex>=1.0',
    'sphinxcontrib-websupport>=1.0.1',
]
all = ["smrf-dev[dev,docs]"]

[tool.setuptools.packages.find]
where = [""]

[tool.setuptools.package-data]
smrf = [
    'framework/CoreConfig.ini',
    'framework/.qotw',
    'framework/recipes.ini',
    'framework/changelog.ini',
]

[tool.setuptools_scm]
local_scheme = 'node-and-date'
write_to = "smrf/version.py"

[tool.hatch.build.targets.sdist]
exclude = ["/smrf/tests"]
