# Config file for the SMRF WUS-D3 test. Based on config.ini, with WRF input
[topo]
filename:                      ./topo/topo.nc


################################################################################
# Dates to run model
################################################################################

[time]
time_step:                     60
start_date:                    2022-11-08 00:00
end_date:                      2022-11-08 23:00
time_zone:                     utc


################################################################################
# Gridded dataset
################################################################################

[gridded]
wrf_metadata:                  ./WUS-D3/WUS-D3_domain.nc
wrf_prefix:                    auxhist_d01
wrf_path:                      ./WUS-D3
data_type:                     wrf

################################################################################
# Air temperature distribution
################################################################################

[air_temp]
grid_local_n:                  9
distribution:                  grid
grid_local:                    True

################################################################################
# Vapor pressure distribution
################################################################################

[vapor_pressure]
grid_local_n:                  9
distribution:                  grid
grid_local:                    True

################################################################################
# Wind speed and wind direction distribution
################################################################################

[wind]
detrend_slope:                 1
detrend:                       False
grid_method:                   linear
grid_mask:                     True
grid_local:                    False
wind_model:                    interp
distribution:                  grid

################################################################################
# Precipitation distribution
################################################################################

[precip]
grid_local_n:                  9
distribution:                  grid
grid_local:		               True

################################################################################
# Albedo distribution
################################################################################

[albedo]

################################################################################
# Solar radiation distribution
################################################################################

[solar]

################################################################################
# Cloud Factor - Fraction used to limit solar radiation Cloudy (0) - Sunny (1)
################################################################################

[cloud_factor]

################################################################################
# Thermal radiation distribution
################################################################################

[thermal]
grid_local_n:                  9
grid_local:                    True

################################################################################
#  Soil temperature
################################################################################

[soil_temp]

################################################################################
# Output variables
################################################################################

[output]
out_location:                  ./output
file_type:                     netcdf
frequency:                     1
variables:                     hrrr_thermal, air_temp, vapor_pressure, wind_speed, wind_direction, net_solar, precip, percent_snow, snow_density, precip_temp
mask_output:                   False
input_backup:                  True


################################################################################
# System variables
################################################################################

[system]
log_level:                     debug
log_file:                      ./output/log.txt
